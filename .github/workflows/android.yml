name: Build Android APK

# Run it by hand: GitHub -> Actions -> "Build Android APK" -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licences (the SDK is already on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Load the signing key from the KEYSTORE_BASE64 secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/neonotes.jks

      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NeoNotes-apk
          path: android/app/build/outputs/apk/release/app-release.apk
