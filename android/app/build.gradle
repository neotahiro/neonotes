plugins { id 'com.android.application' }

android {
    namespace 'com.neonotes.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.neonotes.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../neonotes.jks')
            storePassword 'neonotes-personal'
            keyAlias 'neonotes'
            keyPassword 'neonotes-personal'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
